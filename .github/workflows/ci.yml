# Проверки на каждый push в main и на pull request; образ установщика — в ghcr.io из main.
#
# go      — make: gofmt, vet, тесты (и statusline.sh против примеров), сборка; shellcheck скриптов;
# lint    — golangci-lint той же версии, что make lint;
# plugins — Claude Code той же версии, что в Makefile: validate маркетплейса и плагинов, тесты модов;
# image   — вне main только сборка; из main — linux/amd64 и linux/arm64 в ghcr.io.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check vet test build
      - run: shellcheck plugins/*/scripts/*.sh

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # как GOLANGCI_LINT_VERSION в Makefile

  plugins:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g "@anthropic-ai/claude-code@$(sed -n 's/^CLAUDE_CODE_VERSION *:= *//p' Makefile)"
      - run: claude --version
      - run: make plugins-check

  image:
    needs: [go, lint, plugins]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/scary-production/claude-plugins:latest
            ghcr.io/scary-production/claude-plugins:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
